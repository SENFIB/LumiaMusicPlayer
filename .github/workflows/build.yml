name: Build Lumia ARM

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup Dummy Logo (If Missing)
      shell: powershell
      run: |
        $proj = (Get-ChildItem -Path . -Filter *.csproj -Recurse | Select-Object -First 1).Directory.FullName
        $assetDir = Join-Path $proj "Assets"
        if (-not (Test-Path $assetDir)) { New-Item -ItemType Directory -Path $assetDir -Force }
        $logoPath = Join-Path $assetDir "StoreLogo.png"
        if (-not (Test-Path $logoPath)) {
            Add-Type -AssemblyName System.Drawing
            $bmp = New-Object System.Drawing.Bitmap 150, 150
            $bmp.Save($logoPath, [System.Drawing.Imaging.ImageFormat]::Png)
            $bmp.Dispose()
            Write-Host "Created placeholder StoreLogo.png"
        }

    - name: Create Test Certificate
      shell: powershell
      run: |
        $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=LumiaDev" -KeyUsage DigitalSignature -FriendlyName "LumiaDevCert" -CertStoreLocation "Cert:\LocalMachine\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
        $pfxPassword = ConvertTo-SecureString -String "Lumia1234" -Force -AsPlainText
        Export-PfxCertificate -Cert $cert -FilePath "$env:GITHUB_WORKSPACE\LumiaDev.pfx" -Password $pfxPassword
        Export-Certificate -Cert $cert -FilePath "$env:GITHUB_WORKSPACE\LumiaDev.cer"

    - name: Select ARM-Compatible SDK and Restore
      shell: powershell
      run: |
        $sdkDir = "C:\Program Files (x86)\Windows Kits\10\Platforms\UAP"
        # پیدا کردن بهترین SDK که کمتر یا مساوی با 22621 باشه تا پردازنده لومیا ساپورت بشه
        $compatibleSdk = (Get-ChildItem $sdkDir | Where-Object { [version]$_.Name -le [version]"10.0.22621.0" } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1).Name
        Write-Host "Selected ARM Compatible SDK: $compatibleSdk"
        echo "TARGET_SDK=$compatibleSdk" >> $env:GITHUB_ENV
        
        $projectFile = (Get-ChildItem -Path . -Filter *.csproj -Recurse | Select-Object -First 1).FullName
        msbuild $projectFile /t:Restore /p:Platform=ARM /p:TargetPlatformVersion=$compatibleSdk

    - name: Build ARM Appx
      shell: powershell
      run: |
        $projectFile = (Get-ChildItem -Path . -Filter *.csproj -Recurse | Select-Object -First 1).FullName
        $params = @(
            $projectFile,
            "/p:Configuration=Release",
            "/p:Platform=ARM",
            "/p:TargetPlatformVersion=$env:TARGET_SDK",
            "/p:TargetPlatformMinVersion=10.0.14393.0",
            "/p:UseDotNetNativeToolchain=false",
            "/p:AppxPackageDir=$env:GITHUB_WORKSPACE\Output\",
            "/p:AppxBundle=Never",
            "/p:UapAppxPackageBuildMode=SideloadOnly",
            "/p:PackageCertificateKeyFile=$env:GITHUB_WORKSPACE\LumiaDev.pfx",
            "/p:PackageCertificatePassword=Lumia1234",
            "/p:AppxPackageSigningEnabled=true"
        )
        msbuild @params

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Lumia640XL-App
        path: |
          Output\**\*.appx
          Output\**\*.cer
          LumiaDev.cer
