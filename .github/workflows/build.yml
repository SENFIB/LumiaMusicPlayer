name: Build Lumia ARM

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Generate Exact Required Logos
      shell: powershell
      run: |
        $proj = (Get-ChildItem -Path . -Filter *.csproj -Recurse | Select-Object -First 1).Directory.FullName
        $assetDir = Join-Path $proj "Assets"
        if (-not (Test-Path $assetDir)) { New-Item -ItemType Directory -Path $assetDir -Force }
        Add-Type -AssemblyName System.Drawing

        $requiredLogos = @{
            "Square44x44Logo.png"   = @(44, 44)
            "Square150x150Logo.png" = @(150, 150)
            "StoreLogo.png"         = @(50, 50)
            "SplashScreen.png"      = @(620, 300)
        }

        foreach ($name in $requiredLogos.Keys) {
            $path = Join-Path $assetDir $name
            $w = $requiredLogos[$name][0]
            $h = $requiredLogos[$name][1]
            $bmp = New-Object System.Drawing.Bitmap $w, $h
            $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
            $bmp.Dispose()
        }

    - name: Create Official AppX Code-Signing Certificate
      shell: powershell
      run: |
        $cert = New-SelfSignedCertificate -Type Custom `
                -Subject "CN=LumiaDev" `
                -KeyUsage DigitalSignature `
                -FriendlyName "LumiaDev" `
                -CertStoreLocation "Cert:\CurrentUser\My" `
                -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3") `
                -NotAfter (Get-Date).AddYears(5)
        
        $pfxPassword = ConvertTo-SecureString -String "Lumia1234" -Force -AsPlainText
        Export-PfxCertificate -Cert $cert -FilePath "$env:GITHUB_WORKSPACE\LumiaDev.pfx" -Password $pfxPassword
        Export-Certificate -Cert $cert -FilePath "$env:GITHUB_WORKSPACE\LumiaDev.cer"

    - name: Restore NuGet Packages
      shell: powershell
      run: |
        $projectFile = (Get-ChildItem -Path . -Filter *.csproj -Recurse | Select-Object -First 1).FullName
        msbuild $projectFile /t:Restore /p:Platform=ARM

    - name: Build Standalone ARM Appx
      shell: powershell
      run: |
        $projectFile = (Get-ChildItem -Path . -Filter *.csproj -Recurse | Select-Object -First 1).FullName
        $params = @(
            $projectFile,
            "/p:Configuration=Release",
            "/p:Platform=ARM",
            "/p:TargetPlatformVersion=10.0.17763.0",
            "/p:TargetPlatformMinVersion=10.0.14393.0",
            "/p:UseDotNetNativeToolchain=false",
            "/p:AppxPackageDir=$env:GITHUB_WORKSPACE\Output\",
            "/p:AppxBundle=Never",
            "/p:UapAppxPackageBuildMode=SideloadOnly",
            "/p:PackageCertificateKeyFile=$env:GITHUB_WORKSPACE\LumiaDev.pfx",
            "/p:PackageCertificatePassword=Lumia1234",
            "/p:AppxPackageSigningEnabled=true"
        )
        msbuild @params

    - name: Prepare Clean Release Package
      shell: powershell
      run: |
        New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\ReleasePackage" -Force
        New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\ReleasePackage\Dependencies" -Force

        $mainAppx = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\Output" -Filter "*.appx" -Recurse | Where-Object { $_.FullName -notmatch "Dependencies" } | Select-Object -First 1
        Copy-Item $mainAppx.FullName -Destination "$env:GITHUB_WORKSPACE\ReleasePackage\LumiaMusicPlayer.appx"
        Copy-Item "$env:GITHUB_WORKSPACE\LumiaDev.cer" -Destination "$env:GITHUB_WORKSPACE\ReleasePackage\LumiaDev.cer"

        $depFiles = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\Output" -Filter "*.appx" -Recurse | Where-Object { $_.FullName -match "Dependencies" }
        foreach ($d in $depFiles) {
            Copy-Item $d.FullName -Destination "$env:GITHUB_WORKSPACE\ReleasePackage\Dependencies\"
        }

    - name: Upload Clean Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Lumia640XL-App
        path: ReleasePackage/**
